; FARMSENTRY firmware — PlatformIO project file
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Uncomment and set to your board's programming port if auto-detect
; picks the wrong one (run `pio device list` to see options).
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

build_flags =
    -DCONFIG_FREERTOS_HZ=1000
